name: magic_payments
description: "Subscription billing for Magic apps: one entitlement answer across web checkout and App Store or Play purchases, with no rail logic in your widgets."
version: 1.0.1
homepage: https://anilcancakir.com/magic_payments
repository: https://github.com/anilcancakir/magic_payments
issue_tracker: https://github.com/anilcancakir/magic_payments/issues

topics:
  - payments
  - billing
  - in-app-purchase
  - magic-framework
  - flutter-plugin

# Inherited from `magic`, not chosen here: magic 1.0.0 declares
# `sdk: ">=3.13.0 <4.0.0"` and `flutter: ">=3.47.0"`, and a package cannot
# resolve below its own dependency's floor. Copying the older block from a
# sibling plugin would produce a pubspec that claims support it does not have.
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^1.0.0
  # A floor, not a conflict resolution: a solver cannot hand this package an
  # older CLI than the one it is verified against, whatever else in the graph
  # asks for a lower caret.
  dowel: ^1.0.0
  # The STORE rail's SDK, and the only third-party billing dependency here. Its
  # own floors (`sdk >=3.4.0`, `flutter >=3.22.0`) sit BELOW this package's, so
  # adding it cannot drag the environment block down; the block above stays
  # magic's.
  purchases_flutter: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  flutter_lints: ^6.0.0
