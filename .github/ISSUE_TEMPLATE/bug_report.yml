name: Bug Report
description: Report a bug in Magic Payments Plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Billing bugs are easier to fix with the rail named,
        so please say which one you were on.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        For example:
        1. Register `PaymentsServiceProvider` in config
        2. Call `Payments.web?.checkout(productKey: 'pro_annual', successUrl: ..., cancelUrl: ...)` on web
        3. Read `Payments.currentEntitlement()` once your backend's webhook has landed
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: dropdown
    id: rail
    attributes:
      label: Rail
      description: Which billing rail was in use?
      options:
        - Web rail
        - Store rail on iOS (App Store)
        - Store rail on Android (Play)
        - Not rail-specific
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - PaymentsManager (Singleton, resolution)
        - Contracts (BillingService, WebBillingService, StoreBillingService)
        - Drivers (web, store)
        - Models (BillingEntitlement, BillingCheckoutSession, BillingInvoicesPage, Invoice, PaymentMethod, PurchaseContext, StoreProductOffer, UsageStat)
        - Service provider / config
        - CLI (install, configure, doctor)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Reproduction Code
      description: The smallest snippet that shows the problem.
      render: dart

  - type: input
    id: plugin-version
    attributes:
      label: Magic Payments Version
      placeholder: "1.0.2"
    validations:
      required: true

  - type: input
    id: magic-version
    attributes:
      label: Magic Framework Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter Version
      placeholder: "Flutter 3.47.0 / Dart 3.13.0"
    validations:
      required: true
